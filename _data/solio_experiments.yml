allowed_phases:
  baseline:
    - recorded
  environment_change:
    - observed
    - ended
  problem:
    - active
    - resolved
  improvement:
    - planned
    - testing
    - verified
    - abandoned
  maintenance:
    - planned
    - completed

experiment_log:
  - id: baseline
    type: baseline
    title: ベースライン計測
    description: 購入直後の純正状態を測定
    date: 2025-09-06
    phase: recorded
    targets: []
    cost_score: 0
    link: /solio/baseline/

  - id: degradation
    type: problem
    title: 燃費悪化
    description: インジェクターもしくは点火プラグの汚れによる燃費悪化
    date: 2025-09-20
    phase: active
    targets:
      - fuel_economy
      - combustion_condition
    cost_score: 0
    fuel_economy_factor_actual: 0.7838
    link: /solio/fcr062-effect/

  - id: engine_recovery
    type: problem
    title: FCR-062でエンジンコンディション改善
    description: FCR-062で燃料経路・燃焼室の洗浄を行い燃焼状態の正常化を図る
    date: 2025-09-23
    phase: resolved
    targets:
      - fuel_economy
      - combustion_condition
      - durability
    confidence_score: 0.9
    cost_score: 0.1
    caused_by: degradation
    link: /solio/fcr062-effect/

  - id: fcr062_before_engine_oil_change
    type: maintenance
    title: エンジンオイル交換前にFCR-062投入
    description: FCR-062で燃料経路・燃焼室の洗浄を行い、エンジンオイル交換の効果を最大化する
    date: 2026-05-03
    phase: completed
    targets:
      - combustion_condition
      - durability
    confidence_score: 0.9
    cost_score: 0.1
    link: /solio/fcr062-effect/

  - id: increased_idle_ac_usage
    type: environment_change
    title: アイドリング冷房機会の増加
    description: >
      乳児同乗機会の増加により、
      買い物や待機中にエンジン停止できない場面が増加。
      停車中のエアコン稼働時間が増え、
      満タン法燃費に影響した可能性がある。
    date: 2026-05-17
    phase: observed
    targets:
      - fuel_economy
    confidence_score: 0.8
    link: /solio/idle-ac-usage-fuel-economy/

  - id: oil_viscosity
    type: improvement
    title: エンジンオイルの粘度変更
    description: 5W-30から0W-16へ変更しフリクション低減を狙う
    planned_date: 2026-02-25
    date: 2026-06-25
    phase: testing
    targets:
      - fuel_economy
      - cold_start
    confidence_score: 1.0
    cost_score: 0.5
    fuel_economy_factor_estimate_min: 1.0100
    fuel_economy_factor_estimate_max: 1.0300
