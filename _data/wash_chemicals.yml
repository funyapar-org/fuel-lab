shampoo:
  dcm_100:
    company: DCM
    name: 濃縮泡立ちカーシャンプー
    img: dcm_100.jpg
    comment: "1本で中型車約25台分の洗車が可能な100倍シャンプー。起泡力、泡密度に優れた2つの洗浄成分が、きめ細かいクリーミーな泡立ちを作り上げます。潤滑性に優れた天然由来成分100％の界面活性剤APGを配合、汚れとボディの隙間に素早く入り込み洗車キズを防いでコーティング被膜を傷めずやさしく洗車できます。これ一本でシャンプー液100Lが作れるのでコスパ最強です。"
  sur_wax_in:
    company: シュアラスター
    name: ワックスinシャンプー
    img: sur_wax_in.jpg
    comment: "洗浄と同時にワックスによって撥水効果を発揮するシャンプー。純粋な洗浄力は弱め。実はガラスやミラー、未塗装樹脂には油膜になるので使用してはいけない。ホイールも油膜がブレーキダストや砂などの汚れを絡め取ってしまい、高圧洗浄機でも取りにくい汚れになってしまう可能性がある。時短になると思って使用していたが結果的に余計な労力を増やしてしまっていた。"
    link: https://amzn.to/4eTBEor
  sur_cleaner_in:
    company: シュアラスター
    name: クリーナーinシャンプー
    img: sur_cleaner_in.jpg
    comment: "コンパウンド入りで古いワックスやコーティング剤を落として下地を整えるシャンプー。毎回使用するとボディを痛めるので注意すること。水で薄めず使用するので消費量は多くなる。"
    link: https://amzn.to/3QJfgF6
coating:
  cc_water_gold:
    company: プロスタッフ
    name: CCウォーターゴールド
    img: cc_water_gold.jpg
    comment: "2026年現在一番売れているコーティング剤。水にぬれた状態のボディ、ガラス、ミラー、未塗装樹脂にも使用可能でスプレーして水滴と一緒に拭き取れば施工が完了する。1回目より2回目、3回目と回を重ねるごとに撥水力が増していく。「専用スプレーボトル以外に入れるな」と書いてあるが私はダイソーの逆さで使えるスプレーボトルに入れて使用している。"
    link: https://amzn.to/4yfACuk
tire_wax:
  sur_tire_wax_r:
    company: シュアラスター
    name: タイヤコーティング+R
    img: sur_tire_wax_r.jpg
    comment: "水性タイヤワックス。専用スポンジで乳液上のワックスを塗り込むタイプ。水性でありながら耐久力は驚きの約6か月間！ 特殊変性シリコーンを浸透定着させ、劣化防止剤がにじみ出るのを抑えてタイヤを保護する。"
    link: https://amzn.to/4fsY4wT
  no_touch_uv:
    company: イチネンケミカルズ
    name: ノータッチUV
    comment: "水性タイヤワックス。スプレーするだけで仕上がるタイヤワックス。UVカット成分配合でタイヤの劣化を防ぐ。耐久力は低め。ホイールに付着した場合はすぐに拭き取る必要があるため以外に楽にはならなそう。"
    link: https://amzn.to/44iBnFs
  aerospace_protectant_303:
    company: 303 Products
    name: "303 Aerospace Protectant"
    comment: "ビニール・ゴム・プラスチック製品などを紫外線劣化から守る水性の保護剤。タイヤや未塗装樹脂の艶出しに使用できる。耐久力は1か月以上。厳密にはタイヤワックスではないためタイヤに与える艶感は少なめ。私はあらかじめクロスにしみこませた状態で洗車場に持ち込みタイヤに塗り込むという使用方法で時短を狙っている。"
    link: https://amzn.to/4wu6Ss2