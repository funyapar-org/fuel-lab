sponge:
  daiso_compresed_sponge:
    company: ダイソー
    name: 洗車スポンジ(圧縮タイプ)
    comment: "フラットなので砂を逃がす力が弱く、洗車傷が入りやすいと思われる。膨らむと結構な大きさになり、シャンプー液を多量に保持できるため一面を洗いきるのに便利。圧縮タイプであるが乾くと縮むわけではない。"
  daiso_handle_sponge:
    company: ダイソー
    name: 柄付洗車スポンジ
    comment: "屋根上の汚れなど、手が届きにくい所にボディ部分に手が届きにくいボンネットの中央や屋根上にも届く。私のソリオもルーフが高いので重宝している。スポンジが柄から取れないので、シャンプー液に浸したり、すすいだりするのがやりにくい。"
brush:
  daiso_tire_brush:
    company: ダイソー
    name: 通水ブラシ
    comment: "「洗う」と「流す」が同時にできるタイヤホイールにホースから水を引いてきてブラシの植毛部から水が流れ出てくるので、洗うと流すが同時にできる。しかし、コイン洗車場では水道を独占してホースを伸ばすといったことはできないのでその力を発揮する場面はない。ただのタイヤブラシとして使用しているがヘッドが大きいので奥まったところを洗うのには向いていない。"
  daiso_mini_tire_brush:
    company: ダイソー
    name: 握りやすいタイヤブラシ
    comment: "手のひらサイズのタイヤブラシ。洗車道具として持ち運ぶときには便利であるが、毛足が短く奥まったところを洗うのには向いていない。"
bucket:
  ganbari_bucket:
    company: イノマタ化学
    name: がんばりバケツ15L
    comment: "2つのバケツがセットになっている。外側のバケツの容量は約15L、内側のバケツの容量は約11L。踏み台にもなる優れものだが、まだ踏み台としても使える優れもの。私の洗車道具をまとめて持ち運ぶ入れ物としても使用している。"
    link: https://amzn.to/4peRy0a
pressure_washer:
  karcher_oc3_with_foam_nozzle:
    company: ケルヒャー
    name: OC3+フォームノズル
    comment: "バケツ型の高圧洗浄機。実は水圧は低めのモデル。フォームノズルを使用することで、シャンプー液を泡としてボディに付着させることができるが、薄めの泡ですぐに消えてしまいやすいため、一気に車全体を洗うのではなく各面ごとに洗っていくことを推奨する。"
    link: https://amzn.to/4gwL9uT
wash_mitten:
  daiso_wash_mitten:
    company: ダイソー
    name: マイクロファイバー洗車グローブ
    comment: "マイクロファイバー素材の洗車グローブ。手を保護し、車の表面を傷つけずに洗うことができる。薄手なのでホイール洗浄など細かいところに向いている。"
  fieety_wash_mitten:
    company: Fieety
    name: ムートンカーウォッシュグローブ
    comment: "人工羊毛素材の洗車グローブ。手を保護し、車の表面を傷つけずに洗うことができる。厚手なので、より強い力で洗浄する必要がある場面に向いている。人工羊毛なので洗濯機で洗える。3個セットでコスパに数れており、汚れてきたらホイール洗浄用に回すこともできる。"
    link: https://amzn.to/4pftuu0
cloth:
  daiso_microfiber_cloth:
    company: ダイソー
    name: マイクロファイバークロス
    comment: "マイクロファイバー素材のクロス。3枚セット。薄手で小さめだが、大きなクロスを折りたたんできれいな面を出しながら吹き上げるより、ぬれたり汚れたりしたらすぐに新しいクロスに切り替えるという方法で時短を狙っている。ボディの水滴拭き取りや、ホイールの汚れ拭き取りなどに使用している。"
  dcm_big_microfiber_cloth:
    company: DCM
    name: マイクロファイバークロス
    comment: "マイクロファイバー素材のクロス。大きめで厚手なので、ルーフの水滴拭き取りに向いている。"
blower:
  aal_mini_blower:
    company: AAL
    name: 充電式小型ブロアー
    comment: "充電式小型エアダスター。風量が出るのでルーフ上の多量の水滴を吹き飛ばす用途で使用する。ルーフ以外は水滴量は多くないのでタイパを考えて使用しない。"
    link: https://amzn.to/4phlWHd
step_stool:
  dcm_step_stool:
    company: DCM
    name: 折り畳み式踏み台
    comment: "樹脂製の折り畳み式踏み台。ルーフ上の洗浄や水滴拭き取りに使用する。コイン洗車場に置き忘れたことがあるのでこいつは2代目。"