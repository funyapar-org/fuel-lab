      price: 300

  chemicals:
    - category: カーシャンプー
      name: DCM 濃縮泡立ちカーシャンプー (40mlを100倍希釈4Lで使用)
    - category: カーシャンプー
      name: シュアラスター クリーナーinシャンプー（下地作り）
    - category: コーティング剤
      name: CCウォーターG
    - category: タイヤワックス
      name: シュアラスター タイヤコーティング+R

  tools:
    - イノマタ化学 がんばりバケツ
    - マイクロファイバー6枚
    - スポンジ
    - 取っ手付きスポンジ
    - タイヤブラシ
    - 折り畳み式踏み台

  findings:
    - ノーマルカーシャンプーを含んだスポンジにクリーナーinシャンプーを塗布して使用したが、リセット効果が薄まってしまった。
    - クリーナーinシャンプーを毎回塗布して洗車するので時間がかかった
    - 下回り洗浄は高圧洗浄機で行った
    - ホイールキャップは事前に家で洗浄しておいたので、洗車当日は装着のみで楽だった
    - CCウォーターGは拭き上げが楽で、下地処理が不十分にもかかわらず切れに仕上がりムラもできにくかった

  next_actions:
    - 工程削減（クリーナーinシャンプーは次回以降使用しない）

