    - 折り畳み式踏み台

  findings:
    - 作業時間が長すぎる（90分）
    - 各面の分割洗浄は理にかなっている
    - 下回り洗浄は高圧洗浄機でもできる
    - 濃いめシャンプーは水滴跡が発生
    - ホイールキャップ洗浄は事前に家でやるべき
    - 本来ワックスinシャンプーはガラスに使用してはいけない
    - タイヤワックスは接地している部分のショルダーに塗れなかった

  next_actions:
    - 工程削減（門型洗車機を高圧洗浄機2分に置き換え）
    - ホイールキャップ事前洗浄
    - 洗浄とコーティングの分離検討
    - タイヤワックスの塗布時には車を動かして塗りもれたショルダー部分にも塗る

