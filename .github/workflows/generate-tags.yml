name: Generate Tag Pages

on:
  push:
    branches:
      - main
    paths:
　　　　- "_tags/*.md"
      - "_knowledge/*.md"
      - "_solio/*.md"

jobs:
  generate-tags:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Generate tag pages
        run: |
          set -e
      
          mkdir -p _tags
      
          tags=$(grep -rho "tags:.*" . \
            | sed 's/tags:[[:space:]]*//' \
            | tr -d '[],' \
            | tr ' ' '\n' \
            | grep -E '^[a-z0-9-]+$' \
            | sort -u)
      
          for tag in $tags; do
            file="_tags/${tag}.md"
            if [ ! -f "$file" ]; then
              echo "Creating tag page: $tag"
      
              {
                echo "---"
                echo "layout: tag"
                echo "tag: $tag"
                echo "title: \"$tag\""
                echo "---"
              } > "$file"
      
            fi
          done

      - name: Commit generated tag pages
        run: |
          if git status --porcelain | grep .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
      
            git add _tags
            git commit -m "chore: auto-generate tag pages"
            git push
          else
            echo "No changes to commit"
          fi