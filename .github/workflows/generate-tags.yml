name: Generate Tag Pages

on:
  push:
    branches:
      - main
    paths:
      - "_knowledge/**/*.md"
      - "_solio/**/*.md"

permissions:
  contents: write

jobs:
  generate-tags:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Generate tag pages
        run: |
          ls -la
          ls -la _knowledge || true
          ls -la _solio || true
          find . -name "*.md" | head -20

          set -e

          mkdir -p _tags

          # findコマンドを使用してサブディレクトリ含めて.mdファイルを検索し、awkに渡す
          tags=$(
            find _knowledge _solio -type f -name "*.md" 2>/dev/null -exec awk '
              /^---$/ { fm = !fm; next }
              fm && /^tags:/ { in_tags = 1; next }
              fm && in_tags && /^[[:space:]]*-[[:space:]]*/ {
                gsub(/^[[:space:]]*-[[:space:]]*/, "", $0)
                print
                next
              }
              fm && in_tags && !/^[[:space:]]*-/ { in_tags = 0 }
            ' {} + \
            | grep -E '^[a-z0-9-]+$' \
            | sort -u
          )
        
          echo "Detected tags:"
          echo "$tags"

          for tag in $tags; do
            file="_tags/${tag}.md"
            if [ ! -f "$file" ]; then
              echo "Creating tag page: $tag"
              {
                echo "---"
                echo "layout: tag"
                echo "tag: $tag"
                echo "title: \"$tag\""
                echo "---"
              } > "$file"
            fi
          done

      - name: Commit generated tag pages
        run: |
          git status
          if git status --porcelain | grep .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add _tags
            git commit -m "chore: auto-generate tag pages"
            git push --verbose
          else
            echo "No changes to commit"
          fi