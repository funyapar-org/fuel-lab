<div class="card shadow-sm mb-4">
  <div class="card-body">

    <h2 class="h4 mb-3">現在の目標と進捗</h2>

    <div class="row text-center mb-3">
      <div class="col-md-4">
        <div class="fw-bold text-muted small">季節補正後の直近1年平均実燃費</div>
        <div class="fs-4">
          {{ normalized_recent_avg_economy }} km/L
        </div>
      </div>

      <div class="col-md-4">
        <div class="fw-bold text-muted small">目標</div>
        <div class="fs-4">
          {{ target }} km/L
        </div>
      </div>

      <div class="col-md-4">
        <div class="fw-bold text-muted small">達成率</div>
        <div class="fs-4">
          {{ progress_percent }}%
        </div>
      </div>
    </div>

    <div class="progress"
          role="progressbar"
          aria-valuenow="{{ progress_percent }}"
          aria-valuemin="0"
          aria-valuemax="100"
          style="height: 24px;">

      <div class="progress-bar progress-bar-striped progress-bar-animated"
            style="width: {{ progress_percent }}%;">
        {{ progress_percent }}%
      </div>

    </div>

    {% assign remaining = target | minus: normalized_recent_avg_economy | round: 2 %}

    <p class="mt-3 mb-0 text-muted small">
      目標まであと {{ remaining }} km/L
    </p>

  </div>
</div>
