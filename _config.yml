title: Fuel Lab - ソリオ実燃費研究所
description: 街乗り主体のソリオ（MA26S/K12C）で、タイヤ・オイル・添加剤・運転技術による燃費改善を実測検証する研究サイトです。
baseurl: ""
url: "https://funyapar-fuel-lab.com"
default_ogp_img: "/assets/ogp/default.png"
markdown: kramdown
theme: null
permalink: pretty
collections:
  about:
    output: true
  carwash:
    output: true
  tools:
    output: true
  knowledge:
    output: true
  solio:
    output: true
  tags:
    output: true
    permalink: /tags/:name/
  category:
    output: true
    permalink: /category/:name/
plugins:
  - jekyll-sitemap
defaults:
  -
    scope:
      type: "tags"
    values:
      sitemap: false